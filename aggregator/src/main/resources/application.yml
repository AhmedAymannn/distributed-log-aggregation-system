server:
  port: 3003

spring:
  application:
    name: AggregatorApp

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      group-id: aggregator-group
  data:
    mongodb:
      # Format: mongodb://username:password@host:port/database_name
      uri: ${MONGODB_URI:mongodb://admin:password@localhost:27017/logs_db?authSource=admin}
